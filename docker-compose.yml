# RabbitMQ + PostgreSQL for local development
# Backend expects amqp://admin:admin123@localhost:5672
# PostgreSQL: postgresql://moto:moto@localhost:5432/moto
# Run from project root: docker compose up -d
# RabbitMQ Management UI: http://localhost:15672 (admin / admin123)
services:
  postgres:
    image: postgres:16-alpine
    container_name: moto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moto
      POSTGRES_PASSWORD: moto
      POSTGRES_DB: moto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moto -d moto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: moto-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
